name: Publish NuGet Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия пакета, например 1.2.3 (без префикса v)'
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write 

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] \
              || { echo "error: invalid version '$VERSION'" >&2; exit 1; }
          else
            TAG="$GITHUB_REF_NAME"
            [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]] \
              || { echo "error: tag '$TAG' is not a valid v<semver>" >&2; exit 1; }
            VERSION="${BASH_REMATCH[1]}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Restore
        run: dotnet restore Nantuc.slnx

      - name: Build
        run: >
          dotnet build Nantuc.slnx -c Release --no-restore
          -p:Version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Pack
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p nupkg
          dotnet pack Nantuc.slnx -c Release --no-build --no-restore -o nupkg \
            -p:PackageVersion="$VERSION" -p:Version="$VERSION"
          shopt -s nullglob
          NUPKGS=(nupkg/*.nupkg)
          [[ ${#NUPKGS[@]} -gt 0 ]] \
            || { echo "error: no .nupkg files produced" >&2; exit 1; }
          printf 'Produced %d package(s):\n' "${#NUPKGS[@]}"
          printf '  - %s\n' "${NUPKGS[@]}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error

      - name: NuGet login (OIDC -> temporary API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: RomanyPe

      - name: Push to nuget.org
        shell: bash
        run: |
          set -euo pipefail
          for nupkg in nupkg/*.nupkg; do
            echo "--- pushing: $(basename "$nupkg") ---"
            dotnet nuget push "$nupkg" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done