name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # для actions/checkout
      packages: write     # для dotnet nuget push в GitHub Packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Поменяйте, если у вас другая версия SDK.
          # Если в репозитории есть global.json — можно вместо этого
          # указать dotnet-version-file: global.json
          dotnet-version: '8.0.x'

      - name: Extract version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v(.+)$ ]]; then
            echo "error: tag '$TAG' does not match pattern 'v*'" >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Pack projects
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          OUTPUT_DIR="$GITHUB_WORKSPACE/nupkg"
          mkdir -p "$OUTPUT_DIR"

          mapfile -t PROJECT_FILES < <(find . -name '*.csproj' \
            -not -path '*/bin/*' \
            -not -path '*/obj/*' \
            -not -iname '*Test*.csproj' \
            -not -iname '*Example*.csproj' \
            -not -iname '*Benchmark*.csproj' \
            | sort)

          if [ ${#PROJECT_FILES[@]} -eq 0 ]; then
            echo "error: no .csproj files found" >&2
            exit 1
          fi

          echo "Found ${#PROJECT_FILES[@]} project(s):"
          printf '  - %s\n' "${PROJECT_FILES[@]}"

          for proj in "${PROJECT_FILES[@]}"; do
            echo "--- packing: $proj ---"
            dotnet pack "$proj" \
              --configuration Release \
              --output "$OUTPUT_DIR" \
              -p:PackageVersion="$VERSION" \
              -p:Version="$VERSION" \
              --nologo
          done

          shopt -s nullglob
          NUPKGS=("$OUTPUT_DIR"/*.nupkg)
          shopt -u nullglob
          if [ ${#NUPKGS[@]} -eq 0 ]; then
            echo "error: no .nupkg files produced" >&2
            exit 1
          fi
          echo "Produced ${#NUPKGS[@]} package(s):"
          printf '  - %s\n' "${NUPKGS[@]}"

      - name: Push to GitHub Packages
        run: |
          set -euo pipefail
          for nupkg in "$GITHUB_WORKSPACE"/nupkg/*.nupkg; do
            echo "--- pushing: $(basename "$nupkg") ---"
            dotnet nuget push "$nupkg" \
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
              --api-key "${{ secrets.GH_TOKEN }}" \
              --skip-duplicate
          done