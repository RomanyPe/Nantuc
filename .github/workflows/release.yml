name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'   # триггер на теги вида v1.0.0 или v1.0.0-beta.1

permissions:
  contents: write    # нужно для создания GitHub Release
  packages: write    # нужно для публикации в GitHub Packages

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полная история для корректной работы SourceLink и Nerdbank.GitVersioning (если используете)

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'   # удалите строку, если у вас стабильный .NET 10

      - name: Extract version from tag
        id: version
        run: |
          # v1.2.3 → 1.2.3
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build -c Release -p:Version=${{ steps.version.outputs.version }} --logger "trx;LogFileName=test-results.trx"
        continue-on-error: true   # не блокировать релиз, если тестов нет или они падают

      - name: Pack all packable projects
        run: dotnet pack --no-build -c Release -p:Version=${{ steps.version.outputs.version }} -o ./nupkg

      - name: Verify package count
        run: |
          COUNT=$(ls ./nupkg/*.nupkg 2>/dev/null | wc -l)
          echo "Упаковано пакетов: $COUNT"
          ls -la ./nupkg/
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ Ни одного пакета не создано. Проверьте атрибуты <IsPackable>true</IsPackable> в проектах."
            exit 1
          fi

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./nupkg/*.nupkg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}   # если в версии есть суффикс (beta, rc), помечаем как pre-release
