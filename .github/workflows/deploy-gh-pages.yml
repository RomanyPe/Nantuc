name: Deploy Blazor WASM (AOT) to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish Blazor WASM with AOT
        run: dotnet publish samples/Nantuc.Samples.InWeb/Nantuc.Samples.InWeb.csproj -c Release -p:RunAOTCompilation=true -p:WasmEnableThreads=false -o release

      - name: Rewrite base-tag for GitHub Pages
        run: sed -i 's/<base href="\/" \/>/<base href="\/Nantuc\/" \/>/g' release/wwwroot/index.html

      - name: Add .nojekyll and 404.html
        run: |
          touch release/wwwroot/.nojekyll
          cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'release/wwwroot'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
