name: Deploy Blazor WASM (AOT) to GitHub Pages

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - 'samples/Nantuc.Samples.InWeb/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Отменяет предыдущий незавершённый деплой, если запушили новое изменение
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore workloads
        run: dotnet workload restore samples/Nantuc.Samples.InWeb/Nantuc.Samples.InWeb.csproj

      - name: Publish Blazor WASM with AOT
        run: dotnet publish samples/Nantuc.Samples.InWeb/Nantuc.Samples.InWeb.csproj -c Release -p:RunAOTCompilation=true -p:WasmEnableThreads=false -o release

      - name: Rewrite base-tag for GitHub Pages
        run: sed -i 's|<base href="/" />|<base href="/Nantuc/" />|g' release/wwwroot/index.html

      - name: Add .nojekyll and 404.html
        run: |
          touch release/wwwroot/.nojekyll
          cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'release/wwwroot'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
